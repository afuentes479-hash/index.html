<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trading Room Pro - Plataforma Completa</title>

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- CHART.JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>

<!-- JSPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* VARIABLES CSS */
:root{
--bg-primary:#0a0e17;
--bg-secondary:#121825;
--bg-card:#1a1f2e;
--bg-elevated:#222936;
--border:#2a3142;
--text-primary:#ffffff;
--text-secondary:#8b92a8;
--accent:#00d4ff;
--accent-hover:#00b8e6;
--green:#00ff88;
--green-dark:#00cc6a;
--red:#ff3366;
--red-dark:#e62958;
--gold:#ffd700;
--purple:#a78bfa;
--blue:#3b82f6;
--orange:#ff9500;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
background:var(--bg-primary);
color:var(--text-primary);
overflow-x:hidden;
line-height:1.6;
}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:var(--bg-secondary);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

/* AUTH SCREENS */
.auth-screen{
position:fixed;inset:0;
background:linear-gradient(135deg,rgba(0,212,255,0.05),rgba(167,139,250,0.05));
backdrop-filter:blur(20px);
display:flex;align-items:center;justify-content:center;
z-index:10000;
animation:fadeIn 0.5s;
}

.auth-screen.hidden{display:none;}

.auth-container{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:24px;
padding:3rem;
max-width:480px;
width:90%;
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.auth-logo{text-align:center;margin-bottom:2.5rem;}

.auth-logo-icon{
width:80px;height:80px;
margin:0 auto 1.5rem;
background:linear-gradient(135deg,var(--accent),var(--purple));
border-radius:20px;
display:flex;align-items:center;justify-content:center;
font-size:2.5rem;
}

.auth-title{
font-size:2rem;font-weight:900;
background:linear-gradient(135deg,var(--accent),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:0.5rem;
}

.auth-subtitle{color:var(--text-secondary);font-size:0.95rem;}

.auth-form{display:flex;flex-direction:column;gap:1.25rem;margin-top:2rem;}

.form-group{display:flex;flex-direction:column;gap:0.5rem;}

.form-label{font-weight:600;font-size:0.9rem;color:var(--text-secondary);}

.form-input{
padding:1rem 1.25rem;
background:var(--bg-secondary);
border:1px solid var(--border);
border-radius:12px;
color:var(--text-primary);
font-size:1rem;
font-family:'Inter',sans-serif;
transition:all 0.3s;
}

.form-input:focus{
outline:none;
border-color:var(--accent);
background:var(--bg-elevated);
box-shadow:0 0 0 3px rgba(0,212,255,0.1);
}

.form-input::placeholder{color:var(--text-secondary);opacity:0.5;}

.password-wrapper{position:relative;}

.password-toggle{
position:absolute;right:1rem;top:50%;transform:translateY(-50%);
background:none;border:none;
color:var(--text-secondary);
cursor:pointer;padding:0.5rem;
}

.btn-auth{
padding:1rem 2rem;
background:linear-gradient(135deg,var(--accent),var(--purple));
border:none;border-radius:12px;
color:var(--text-primary);
font-weight:700;font-size:1.05rem;
cursor:pointer;transition:all 0.3s;
margin-top:0.5rem;
}

.btn-auth:hover{
transform:translateY(-2px);
box-shadow:0 10px 30px rgba(0,212,255,0.4);
}

.btn-auth:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

.auth-switch{
text-align:center;
margin-top:1.5rem;
color:var(--text-secondary);
font-size:0.9rem;
}

.auth-switch a{
color:var(--accent);
text-decoration:none;
font-weight:600;
cursor:pointer;
}

.auth-switch a:hover{text-decoration:underline;}

.admin-link{margin-top:1rem;text-align:center;}
.admin-link a{color:var(--gold);text-decoration:none;font-size:0.9rem;font-weight:600;}
.admin-link a:hover{text-decoration:underline;}

.error-message{
background:rgba(255,51,102,0.1);
border:1px solid var(--red);
color:var(--red);
padding:0.75rem 1rem;
border-radius:8px;
font-size:0.9rem;
display:none;
}

.error-message.show{display:block;animation:shake 0.5s;}

@keyframes shake{
0%,100%{transform:translateX(0);}
25%{transform:translateX(-10px);}
75%{transform:translateX(10px);}
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* NAVBAR */
.navbar{
position:fixed;top:0;left:0;right:0;
height:70px;
background:rgba(26,31,46,0.95);
backdrop-filter:blur(20px);
border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between;
padding:0 2rem;
z-index:1000;
}

.nav-brand{display:flex;align-items:center;gap:1rem;}

.nav-logo{
width:40px;height:40px;
background:linear-gradient(135deg,var(--accent),var(--purple));
border-radius:10px;
display:flex;align-items:center;justify-content:center;
font-size:1.3rem;
}

.nav-title{
font-size:1.3rem;font-weight:900;
background:linear-gradient(135deg,var(--accent),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav-actions{display:flex;align-items:center;gap:1.5rem;}

.nav-user{
display:flex;align-items:center;gap:1rem;
padding:0.5rem 1rem;
background:var(--bg-card);
border-radius:12px;
cursor:pointer;
transition:all 0.3s;
}

.nav-user:hover{background:var(--bg-elevated);}

.user-avatar{
width:40px;height:40px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--purple));
display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:0.9rem;
}

.user-info{display:flex;flex-direction:column;}
.user-name{font-weight:700;font-size:0.9rem;}
.user-level{font-size:0.75rem;color:var(--text-secondary);}

.btn-logout{
padding:0.5rem 1rem;
background:rgba(255,51,102,0.1);
border:1px solid var(--red);
border-radius:8px;
color:var(--red);
font-weight:600;
cursor:pointer;
transition:all 0.3s;
}

.btn-logout:hover{background:rgba(255,51,102,0.2);}

/* SIDEBAR */
.sidebar{
position:fixed;left:0;top:70px;bottom:0;
width:280px;
background:var(--bg-secondary);
border-right:1px solid var(--border);
overflow-y:auto;
z-index:999;
}

.sidebar-section{
padding:1.5rem 1rem;
border-bottom:1px solid var(--border);
}

.sidebar-title{
font-size:0.7rem;font-weight:700;
color:var(--text-secondary);
text-transform:uppercase;
letter-spacing:1px;
margin-bottom:1rem;
}

.menu-item{
display:flex;align-items:center;gap:1rem;
padding:0.75rem 1rem;
border-radius:12px;
cursor:pointer;
transition:all 0.3s;
color:var(--text-secondary);
margin-bottom:0.5rem;
position:relative;
}

.menu-item:hover{background:var(--bg-card);color:var(--text-primary);}

.menu-item.active{
background:var(--bg-card);
color:var(--accent);
border-left:3px solid var(--accent);
}

.menu-icon{font-size:1.2rem;width:24px;}

.menu-badge{
position:absolute;right:1rem;top:50%;transform:translateY(-50%);
background:var(--red);color:white;
padding:0.2rem 0.5rem;border-radius:10px;
font-size:0.7rem;font-weight:700;
}

/* MAIN CONTENT */
.main-content{
margin-left:280px;
margin-top:70px;
padding:2rem;
min-height:calc(100vh - 70px);
}

.page-section{display:none;animation:fadeIn 0.5s;}
.page-section.active{display:block;}

.page-header{margin-bottom:2rem;}
.page-title{font-size:2rem;font-weight:900;margin-bottom:0.5rem;}
.page-subtitle{color:var(--text-secondary);font-size:1rem;}

/* CARDS */
.card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:1.5rem;
}

.card-header{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:1.5rem;padding-bottom:1rem;
border-bottom:1px solid var(--border);
}

.card-title{font-size:1.2rem;font-weight:800;}

/* DASHBOARD */
.dashboard-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:1.5rem;
margin-bottom:2rem;
}

.stat-card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:1.5rem;
display:flex;justify-content:space-between;align-items:center;
transition:all 0.3s;
cursor:pointer;
}

.stat-card:hover{
transform:translateY(-5px);
box-shadow:0 10px 30px rgba(0,212,255,0.15);
border-color:var(--accent);
}

.stat-info h3{
font-size:0.85rem;
color:var(--text-secondary);
margin-bottom:0.5rem;
text-transform:uppercase;
letter-spacing:0.5px;
}

.stat-value{
font-size:2rem;font-weight:900;
font-family:'JetBrains Mono',monospace;
}

.stat-change{font-size:0.85rem;margin-top:0.5rem;}
.stat-change.up{color:var(--green);}
.stat-change.down{color:var(--red);}

.stat-icon{font-size:2.5rem;opacity:0.3;}

/* BUTTONS */
.btn{
padding:0.75rem 1.5rem;
border:none;border-radius:12px;
font-weight:700;cursor:pointer;
transition:all 0.3s;
display:inline-flex;align-items:center;justify-content:center;
gap:0.5rem;white-space:nowrap;
font-size:0.9rem;
}

.btn-primary{background:var(--accent);color:var(--bg-primary);}
.btn-primary:hover{
background:var(--accent-hover);
transform:translateY(-2px);
box-shadow:0 5px 20px rgba(0,212,255,0.4);
}

.btn-success{background:var(--green);color:var(--bg-primary);}
.btn-success:hover{background:var(--green-dark);}

.btn-danger{background:var(--red);color:white;}
.btn-danger:hover{background:var(--red-dark);}

.btn-secondary{
background:rgba(255,255,255,0.05);
color:var(--text-primary);
border:1px solid var(--border);
}

.btn-secondary:hover{background:rgba(255,255,255,0.1);}

.btn-sm{padding:0.5rem 1rem;font-size:0.85rem;}

/* SIGNALS */
.signals-header{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:1.5rem;
}

.signal-filters{display:flex;gap:0.75rem;flex-wrap:wrap;}

.filter-btn{
padding:0.5rem 1rem;
background:var(--bg-card);
border:1px solid var(--border);
border-radius:8px;
color:var(--text-secondary);
font-weight:600;cursor:pointer;
transition:all 0.3s;
font-size:0.85rem;
}

.filter-btn:hover,.filter-btn.active{
background:var(--accent);
color:var(--bg-primary);
border-color:var(--accent);
}

.signals-grid{display:grid;gap:1rem;}

.signal-card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:1.5rem;
display:grid;
grid-template-columns:auto 1fr auto;
gap:1.5rem;align-items:center;
position:relative;overflow:hidden;
transition:all 0.3s;
}

.signal-card:hover{border-color:var(--accent);box-shadow:0 5px 20px rgba(0,212,255,0.1);}

.signal-card::before{
content:'';position:absolute;
top:0;left:0;width:4px;height:100%;
}

.signal-card.buy::before{background:var(--green);}
.signal-card.sell::before{background:var(--red);}

.signal-icon{
width:60px;height:60px;
border-radius:12px;
display:flex;align-items:center;justify-content:center;
font-size:1.5rem;font-weight:700;
}

.signal-card.buy .signal-icon{background:rgba(0,255,136,0.1);color:var(--green);}
.signal-card.sell .signal-icon{background:rgba(255,51,102,0.1);color:var(--red);}

.signal-info{flex:1;}

.signal-header{
display:flex;align-items:center;gap:1rem;
margin-bottom:0.75rem;flex-wrap:wrap;
}

.signal-asset{font-size:1.2rem;font-weight:800;}

.signal-badge{
padding:0.25rem 0.75rem;
border-radius:6px;
font-size:0.75rem;font-weight:700;
text-transform:uppercase;
}

.signal-direction.buy{background:rgba(0,255,136,0.2);color:var(--green);}
.signal-direction.sell{background:rgba(255,51,102,0.2);color:var(--red);}

.signal-confidence{background:rgba(0,212,255,0.1);color:var(--accent);}
.signal-status{background:rgba(255,149,0,0.1);color:var(--orange);}

.signal-details{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
gap:1rem;font-size:0.85rem;
}

.signal-detail{display:flex;flex-direction:column;gap:0.25rem;}
.signal-label{color:var(--text-secondary);font-size:0.75rem;}
.signal-value{font-weight:700;font-family:'JetBrains Mono',monospace;}

.signal-actions{display:flex;flex-direction:column;gap:0.5rem;}

/* SIMULATOR */
.simulator-container{
display:grid;
grid-template-columns:2fr 1fr;
gap:2rem;
}

.chart-container{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:1.5rem;
}

.chart-header{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:1.5rem;
}

.chart-title{font-size:1.5rem;font-weight:800;}

.chart-price{
font-size:2rem;font-weight:900;
font-family:'JetBrains Mono',monospace;
}

.price-change{font-size:1rem;font-weight:700;margin-left:0.5rem;}
.price-change.up{color:var(--green);}
.price-change.down{color:var(--red);}

.chart-canvas{height:400px;position:relative;}

.trade-panel{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:1.5rem;
display:flex;flex-direction:column;gap:1.5rem;
}

.trade-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:1rem;
}

.btn-trade{padding:1.25rem;font-size:1.1rem;}

.position-info{
background:rgba(0,212,255,0.05);
border:1px solid var(--accent);
border-radius:12px;
padding:1.25rem;
}

.position-header{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:1rem;
}

.position-type{font-weight:800;font-size:1.1rem;}

.position-details{
display:grid;
grid-template-columns:1fr 1fr;
gap:0.75rem;font-size:0.9rem;
}

.position-detail{display:flex;flex-direction:column;gap:0.25rem;}
.position-label{color:var(--text-secondary);font-size:0.75rem;}
.position-value{font-weight:700;font-family:'JetBrains Mono',monospace;}

/* COMMUNITY */
.community-container{
display:grid;
grid-template-columns:250px 1fr 300px;
gap:2rem;
}

.community-sidebar{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:1.5rem;
height:fit-content;
}

.community-channels{display:flex;flex-direction:column;gap:0.5rem;}

.channel-item{
padding:0.75rem 1rem;
border-radius:8px;
cursor:pointer;
transition:all 0.3s;
display:flex;align-items:center;gap:0.75rem;
color:var(--text-secondary);
}

.channel-item:hover{background:var(--bg-elevated);color:var(--text-primary);}
.channel-item.active{background:var(--accent);color:var(--bg-primary);}

.channel-icon{font-size:1.1rem;}

.chat-main{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
display:flex;flex-direction:column;
height:calc(100vh - 170px);
}

.chat-header{padding:1.5rem;border-bottom:1px solid var(--border);}

.chat-messages{
flex:1;overflow-y:auto;
padding:1.5rem;
display:flex;flex-direction:column;gap:1rem;
}

.chat-message{display:flex;gap:1rem;}

.message-avatar{
width:40px;height:40px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--purple));
display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:0.9rem;
flex-shrink:0;
}

.message-content{flex:1;}

.message-header{
display:flex;align-items:center;gap:0.75rem;
margin-bottom:0.5rem;
}

.message-author{font-weight:700;}
.message-time{font-size:0.75rem;color:var(--text-secondary);}
.message-text{color:var(--text-secondary);line-height:1.6;}

.chat-input-container{
padding:1.5rem;
border-top:1px solid var(--border);
}

.chat-input{
width:100%;
padding:1rem;
background:var(--bg-secondary);
border:1px solid var(--border);
border-radius:12px;
color:var(--text-primary);
font-family:'Inter',sans-serif;
resize:none;
}

.online-users{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:1.5rem;
height:fit-content;
}

.online-count{
display:flex;align-items:center;gap:0.5rem;
margin-bottom:1.5rem;
color:var(--text-secondary);
}

.online-dot{
width:10px;height:10px;
border-radius:50%;
background:var(--green);
animation:pulse 2s infinite;
}

@keyframes pulse{
0%,100%{opacity:1;}
50%{opacity:0.3;}
}

.user-list{display:flex;flex-direction:column;gap:0.75rem;}

.user-item{
display:flex;align-items:center;gap:0.75rem;
padding:0.5rem;
border-radius:8px;
transition:all 0.3s;
cursor:pointer;
}

.user-item:hover{background:var(--bg-elevated);}

.user-item-avatar{
width:32px;height:32px;
border-radius:50%;
background:var(--accent);
display:flex;align-items:center;justify-content:center;
font-size:0.85rem;font-weight:700;
}

.user-item-name{font-size:0.9rem;}

/* ACADEMY */
.academy-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:1.5rem;
}

.course-card{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
padding:1.5rem;
transition:all 0.3s;
cursor:pointer;
}

.course-card:hover{
transform:translateY(-5px);
border-color:var(--accent);
box-shadow:0 10px 30px rgba(0,212,255,0.15);
}

.course-icon{
width:60px;height:60px;
border-radius:12px;
background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(167,139,250,0.2));
display:flex;align-items:center;justify-content:center;
font-size:2rem;
margin-bottom:1rem;
}

.course-title{
font-size:1.2rem;font-weight:800;
margin-bottom:0.75rem;
}

.course-description{
color:var(--text-secondary);
line-height:1.6;
margin-bottom:1rem;
font-size:0.9rem;
}

.course-meta{
display:flex;justify-content:space-between;align-items:center;
padding-top:1rem;
border-top:1px solid var(--border);
}

.course-duration{
font-size:0.85rem;
color:var(--accent);
font-weight:700;
}

/* RANKING */
.ranking-table{
background:var(--bg-card);
border:1px solid var(--border);
border-radius:16px;
overflow:hidden;
}

.ranking-table table{width:100%;border-collapse:collapse;}

.ranking-table th{
text-align:left;
padding:1.25rem 1.5rem;
background:var(--bg-elevated);
color:var(--text-secondary);
font-size:0.85rem;
text-transform:uppercase;
letter-spacing:0.5px;
font-weight:700;
}

.ranking-table td{
padding:1.25rem 1.5rem;
border-top:1px solid var(--border);
}

.rank-position{
font-size:1.5rem;font-weight:900;
font-family:'JetBrains Mono',monospace;
}

.rank-user{display:flex;align-items:center;gap:1rem;}

.rank-avatar{
width:40px;height:40px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--purple));
display:flex;align-items:center;justify-content:center;
font-weight:700;
}

/* ADMIN PANEL */
.admin-panel{
position:fixed;inset:0;
background:var(--bg-primary);
z-index:10001;
display:none;
overflow-y:auto;
padding:2rem;
}

.admin-panel.active{display:block;animation:fadeIn 0.5s;}

.admin-container{max-width:1400px;margin:0 auto;}

.admin-header{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:2rem;
padding-bottom:1.5rem;
